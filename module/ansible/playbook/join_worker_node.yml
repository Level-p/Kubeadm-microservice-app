- hosts: worker-nodes
  become: true
  gather_facts: true
  tasks:
    # Generated at run time on the main master, so this playbook does not
    # depend on any file left behind by init_control_plane.yml.
    - name: Generate a fresh worker join command on the main master
      command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['main-master'][0] }}"
      run_once: true
      register: worker_join
      changed_when: false

    - name: Add new Kubernetes worker member
      command: "{{ worker_join.stdout }} --cri-socket unix:///var/run/cri-dockerd.sock"
      args:
        creates: /etc/kubernetes/kubelet.conf
