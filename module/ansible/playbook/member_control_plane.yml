- hosts: member-master
  become: true
  gather_facts: true
  tasks:
    # Generated at run time so the certificate key always matches the secret
    # currently stored in the cluster (a stale or old key causes
    # "cipher: message authentication failed").
    - name: Generate a fresh control plane join command on the main master
      shell: |
        CERT_KEY=$(kubeadm init phase upload-certs --upload-certs 2>/dev/null | grep -E '^[0-9a-f]{64}$' | tail -1)
        echo "$(kubeadm token create --print-join-command) --control-plane --certificate-key $CERT_KEY"
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['main-master'][0] }}"
      run_once: true
      register: master_join
      changed_when: false

    - name: Add new Kubernetes master member
      command: "{{ master_join.stdout }} --cri-socket unix:///var/run/cri-dockerd.sock"
      args:
        creates: /etc/kubernetes/admin.conf

    - name: make directory and copy required file to it
      shell: |
        sudo su -c 'mkdir -p $HOME/.kube' ubuntu
        sudo su -c 'sudo cp -f /etc/kubernetes/admin.conf $HOME/.kube/config' ubuntu
        sudo su -c 'sudo chown $(id -u):$(id -g) $HOME/.kube/config' ubuntu
