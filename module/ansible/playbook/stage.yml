---
- name: Deploy Microservices Application to Staging Environment
  hosts: haproxy-1
  become: true

  vars:
    app_repo_url: "https://github.com/Level-p/Microservice-Sock-Shop-App-Repo.git"
    app_repo_path: "/home/ubuntu/Sock-Shop-App-Repo"
    deploy_path: "/home/ubuntu/Sock-Shop-App-Repo/"
    kubeconfig_path: "/home/ubuntu/.kube/config"

  tasks:

    - name: Ensure application repository is present and on stage branch
      git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_repo_path }}"
        version: stage
        force: yes
        update: yes

    - name: Ensure stage namespace exists (idempotent)
      shell: kubectl create namespace stage --dry-run=client -o yaml | kubectl apply -f -
      args:
        chdir: "{{ deploy_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      ignore_errors: true

    # complete.yaml hardcodes the sock-shop namespace, so render a copy for stage
    - name: Render manifest for the stage namespace
      shell: sed 's/sock-shop/stage/g' complete.yaml > /tmp/complete-stage.yaml
      args:
        chdir: "{{ deploy_path }}"

    - name: Delete previous staging deployment (safe delete)
      command: kubectl delete -f /tmp/complete-stage.yaml -n stage --ignore-not-found=true
      args:
        chdir: "{{ deploy_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Apply new staging deployment to stage namespace
      command: kubectl apply -f /tmp/complete-stage.yaml -n stage
      args:
        chdir: "{{ deploy_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"